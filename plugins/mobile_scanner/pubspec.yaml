name: mobile_scanner
description: Local QR scanner for FlClash, derived from mobile_scanner 7.4.2.
version: 7.4.2
publish_to: none
repository: https://github.com/juliansteenbakker/mobile_scanner

environment:
  sdk: ^3.7.0
  flutter: ">=3.29.0"

dependencies:
  collection: ^1.15.0
  material_ui: ^1.4.0
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  meta: ^1.16.0
  plugin_platform_interface: ^2.0.2
  web: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  very_good_analysis: ">=8.0.0 <11.0.0"

flutter:
  plugin:
    platforms:
      android:
        package: dev.steenbakker.mobile_scanner
        pluginClass: MobileScannerPlugin
      ios:
        pluginClass: MobileScannerPlugin
        sharedDarwinSource: true
      macos:
        pluginClass: MobileScannerPlugin
        sharedDarwinSource: true
      web:
        pluginClass: MobileScannerWeb
        fileName: src/web/mobile_scanner_web.dart
