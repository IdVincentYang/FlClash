name: build

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

permissions:
  contents: read

env:
  IS_STABLE: ${{ !contains(github.ref, '-') }}
  FLUTTER_VERSION: '3.47.4'
  GO_VERSION: '1.26.4'
  NDK_VERSION: r28c

jobs:
  dart:
    name: Dart
    # A private copy pays for its Actions minutes, so it runs the checks only when
    # started by hand.
    if: &checks github.event_name == 'workflow_dispatch' || !github.event.repository.private
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
          submodules: false

      - name: Setup core source restoration
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Restore exact core source
        run: |
          python tool/restore_l1_t03_core.py
          git submodule update --init --recursive

      - name: Test commit message hook
        run: bash tool/check_commit_msg_test.sh

      - name: Test comment density hook
        run: bash tool/check_comment_density_test.sh

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: false

      - name: Install dependencies
        run: flutter pub get

      - name: Check format
        run: dart format --output=none --set-exit-if-changed lib test tool plugins setup.dart

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Skip the Go core build hook
        run: |
          yq -i '.hooks.user_defines.setup.build_assets = false' pubspec.yaml

      - name: Verify changelog
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        run: dart run tool/changelog.dart verify

      - name: Run tests
        run: flutter test --reporter expanded --coverage

      - name: Check coverage
        run: dart run tool/check_coverage.dart coverage/lcov.info 75

  plugins:
    name: Plugins
    if: *checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: false

      - name: Validate local Flutter packages
        run: bash tool/check_plugins.sh

      - name: Validate setup hooks package
        working-directory: plugins/setup/setup_hooks
        run: |
          dart pub get
          dart analyze
          dart test

  desktop:
    name: Desktop ${{ matrix.platform }}
    if: *checks
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-latest
          - platform: windows
            os: windows-2022
          - platform: macos
            os: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          submodules: false

      - name: Setup core source restoration
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Restore exact core source
        run: |
          python tool/restore_l1_t03_core.py
          git submodule update --init --recursive

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
          cache-dependency-path: core/go.sum

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: false

      - name: Install Linux build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev libayatana-appindicator3-dev libsecret-1-dev

      - name: Setup Xcode
        if: matrix.platform == 'macos'
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app || sudo xcode-select -s /Applications/Xcode_26.2.app
          xcodebuild -version

      - name: Enable git long paths (Windows)
        if: matrix.platform == 'windows'
        run: git config --global core.longpaths true

      - name: Install dependencies
        run: flutter pub get

      # Compiles the desktop runners and the native plugin code that only the
      # tagged release matrix built before; the bundle itself is discarded.
      - name: Build debug bundle
        run: flutter build ${{ matrix.platform }} --debug

  go:
    name: Go core
    if: *checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          submodules: false

      - name: Setup core source restoration
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Restore exact core source
        run: |
          python tool/restore_l1_t03_core.py
          git submodule update --init --recursive

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
          cache-dependency-path: core/go.sum

      - name: Validate Go core wrapper
        working-directory: core
        env:
          CGO_ENABLED: 0
        run: |
          if ! compgen -G '*_test.go' > /dev/null; then
            echo 'No Go tests found in core/; the test step would pass vacuously.' >&2
            exit 1
          fi
          test -z "$(gofmt -l ./*.go ./platform ./tun)" || {
            gofmt -l ./*.go ./platform ./tun >&2
            exit 1
          }
          go test -count=1 .
          go vet .
          GOOS=linux go vet ./platform

      - name: Setup NDK
        uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1
        id: ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}

      - name: Validate the Android core library
        working-directory: core
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          # Nothing else compiles the `android && cgo` files before a `v*` tag.
          CC="$(echo "$ANDROID_NDK_HOME"/toolchains/llvm/prebuilt/*/bin/aarch64-linux-android21-clang)"
          test -x "$CC" || { echo "NDK clang not found at $CC" >&2; exit 1; }
          tags="$(sed -n 's/^tags: *//p' ../build_config.yaml)"
          test -n "$tags" || { echo 'Could not read tags from build_config.yaml' >&2; exit 1; }
          export CGO_ENABLED=1 GOOS=android GOARCH=arm64 CC
          go vet "-tags=$tags" . ./tun ./platform

  android:
    name: Android unit tests
    if: *checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: false

      - name: Install dependencies
        run: flutter pub get

      - name: Setup NDK
        uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1
        id: ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}

      - name: Setup Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
        with:
          cache-disabled: true

      - name: Run Android unit tests
        working-directory: android
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          {
            echo "flutter.sdk=$FLUTTER_ROOT"
            echo "sdk.dir=$ANDROID_HOME"
          } > local.properties
          # `:core` only calls System.loadLibrary; the excluded Flutter tasks would run
          # the native build hooks for every debug ABI, which no JVM unit test consumes.
          ./gradlew :common:testDebugUnitTest :service:testDebugUnitTest :app:testDebugUnitTest \
            -x :app:compileFlutterBuildDebug -x :app:copyFlutterAssetsDebug

  rust:
    name: Rust
    if: *checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Check format
        run: |
          cargo fmt --manifest-path services/helper/Cargo.toml -- --check
          cargo fmt --manifest-path plugins/rust_api/rust/Cargo.toml -- --check

      - name: Run tests
        run: |
          cargo test --manifest-path services/helper/Cargo.toml
          cargo test --manifest-path plugins/rust_api/rust/Cargo.toml

  windows-helper-test:
    name: Windows helper test
    if: *checks
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Check format
        run: cargo fmt --manifest-path services/helper/Cargo.toml -- --check

      - name: Run Windows service tests
        run: cargo test --manifest-path services/helper/Cargo.toml --features windows-service

  release_gate:
    name: Release gate
    if: github.repository == 'chen08209/FlClash' && github.event_name == 'push' && github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    outputs:
      eligible: ${{ steps.gate.outputs.eligible }}
      run_id: ${{ steps.gate.outputs.run_id }}
      stable: ${{ steps.gate.outputs.stable }}
      version: ${{ steps.gate.outputs.version }}
      commit: ${{ steps.gate.outputs.commit }}
      attempt: ${{ steps.gate.outputs.attempt }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Qualify release event
        id: gate
        run: python tool/ci_release.py release-gate

  build:
    name: Build (${{ matrix.role }})
    if: github.repository == 'chen08209/FlClash' && github.event_name == 'push' && github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v') && needs.release_gate.result == 'success' && needs.release_gate.outputs.eligible == 'true' && needs.release_gate.outputs.run_id == github.run_id && needs.release_gate.outputs.attempt == github.run_attempt && needs.release_gate.outputs.commit == github.sha
    needs: [ release_gate, dart, plugins, go, android, rust, windows-helper-test ]
    runs-on: ${{ matrix.os }}
    outputs:
      android_candidate_id: ${{ steps.bind.outputs.android_candidate_id }}
      android_candidate_sha256: ${{ steps.bind.outputs.android_candidate_sha256 }}
      android_candidate_attempt: ${{ steps.bind.outputs.android_candidate_attempt }}
      windows_amd64_id: ${{ steps.bind.outputs.windows_amd64_id }}
      windows_amd64_sha256: ${{ steps.bind.outputs.windows_amd64_sha256 }}
      windows_amd64_attempt: ${{ steps.bind.outputs.windows_amd64_attempt }}
      linux_amd64_id: ${{ steps.bind.outputs.linux_amd64_id }}
      linux_amd64_sha256: ${{ steps.bind.outputs.linux_amd64_sha256 }}
      linux_amd64_attempt: ${{ steps.bind.outputs.linux_amd64_attempt }}
      macos_amd64_id: ${{ steps.bind.outputs.macos_amd64_id }}
      macos_amd64_sha256: ${{ steps.bind.outputs.macos_amd64_sha256 }}
      macos_amd64_attempt: ${{ steps.bind.outputs.macos_amd64_attempt }}
      macos_arm64_id: ${{ steps.bind.outputs.macos_arm64_id }}
      macos_arm64_sha256: ${{ steps.bind.outputs.macos_arm64_sha256 }}
      macos_arm64_attempt: ${{ steps.bind.outputs.macos_arm64_attempt }}
      windows_arm64_id: ${{ steps.bind.outputs.windows_arm64_id }}
      windows_arm64_sha256: ${{ steps.bind.outputs.windows_arm64_sha256 }}
      windows_arm64_attempt: ${{ steps.bind.outputs.windows_arm64_attempt }}
      linux_arm64_id: ${{ steps.bind.outputs.linux_arm64_id }}
      linux_arm64_sha256: ${{ steps.bind.outputs.linux_arm64_sha256 }}
      linux_arm64_attempt: ${{ steps.bind.outputs.linux_arm64_attempt }}
    strategy:
      matrix:
        include:
          - role: android-candidate
            platform: android
            os: ubuntu-latest
          - role: windows-amd64
            platform: windows
            os: Windows-2022
            arch: amd64
          - role: linux-amd64
            platform: linux
            os: ubuntu-22.04
            arch: amd64
          - role: macos-amd64
            platform: macos
            os: macos-15-intel
            arch: amd64
          - role: macos-arm64
            platform: macos
            os: macos-latest
            arch: arm64
          - role: windows-arm64
            platform: windows
            os: windows-11-arm
            arch: arm64
          - role: linux-arm64
            platform: linux
            os: ubuntu-24.04-arm
            arch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Restore exact core source
        run: |
          python tool/restore_l1_t03_core.py
          git submodule update --init --recursive
      - name: Setup Rust on Windows ARM64
        if: matrix.role == 'windows-arm64'
        shell: pwsh
        run: |
          $rustupVersion = python -c "import pathlib,tomllib;print(tomllib.loads(pathlib.Path('tool/android_artifacts.toml').read_text())['artifacts']['rustup']['version'])"
          if ($rustupVersion -ne '1.29.0') { throw 'Update Windows rustup acceptance before use' }
          $installer = Join-Path $env:RUNNER_TEMP 'rustup-init.exe'
          Invoke-WebRequest -Uri "https://static.rust-lang.org/rustup/archive/$rustupVersion/aarch64-pc-windows-msvc/rustup-init.exe" -OutFile $installer
          if ((Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant() -ne '3af309e6c3062aa11df0e932954f69d13b734d8a431e593812f3ecd9ff9e6ef6') { throw 'Rustup installer identity mismatch' }
          $rustVersion = python -c "import pathlib,tomllib;print(tomllib.loads(pathlib.Path('plugins/rust_api/rust/rust-toolchain.toml').read_text())['toolchain']['channel'])"
          if ($rustVersion -notmatch '^[0-9]+\.[0-9]+\.[0-9]+$') { throw 'Invalid Rust toolchain selection' }
          & $installer -y --default-toolchain $rustVersion --no-modify-path
          if ($LASTEXITCODE -ne 0) { throw 'Rustup installation failed' }
          Add-Content $env:GITHUB_PATH "$env:USERPROFILE\.cargo\bin"
      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Setup Gradle
        if: matrix.platform == 'android'
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
        with:
          cache-disabled: true
      - name: Enable git long paths (Windows)
        if: startsWith(matrix.os, 'windows')
        run: git config --global core.longpaths true
      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: master
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: false
      - name: Setup Xcode
        if: matrix.platform == 'macos'
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app || sudo xcode-select -s /Applications/Xcode_26.2.app
          xcodebuild -version
      - name: Setup NDK
        if: matrix.platform == 'android'
        uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1
        id: build-ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: true
          link-to-sdk: true
      - name: Get Flutter Dependency
        run: flutter pub get --enforce-lockfile
      - name: Disable Impeller on Intel macOS
        if: matrix.platform == 'macos' && matrix.arch == 'amd64'
        run: plutil -replace FLTEnableImpeller -bool NO macos/Runner/Info.plist
      - name: Build package without release credentials
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
          APPLICATION_ENV: ${{ needs.release_gate.outputs.stable == 'true' && 'stable' || 'pre' }}
          ANDROID_NDK_HOME: ${{ steps.build-ndk.outputs.ndk-path }}
        run: |
          args=()
          if [[ "$PLATFORM" == 'android' ]]; then args+=(--android-release-candidate); fi
          dart setup.dart "$PLATFORM" --env "$APPLICATION_ENV" "${args[@]}" -v
      - name: Prepare exact producer artifact
        shell: bash
        env:
          PRODUCER_ROLE: ${{ matrix.role }}
        run: python tool/ci_release.py pack --role "$PRODUCER_ROLE" --source dist --destination "$RUNNER_TEMP/producer-artifact"
      - name: Upload producer artifact
        id: artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: build-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.role }}
          path: ${{ runner.temp }}/producer-artifact/
          overwrite: false
          if-no-files-found: error
      - name: Bind this matrix slot only
        id: bind
        shell: bash
        env:
          PRODUCER_ROLE: ${{ matrix.role }}
          ARTIFACT_ID: ${{ steps.artifact.outputs.artifact-id }}
          ARTIFACT_SHA256: ${{ steps.artifact.outputs.artifact-digest }}
        run: |
          python - <<'PYCODE'
          import os,re
          role=os.environ['PRODUCER_ROLE'].replace('-', '_')
          artifact_id=os.environ['ARTIFACT_ID']; checksum=os.environ['ARTIFACT_SHA256']
          if not re.fullmatch('[1-9][0-9]*',artifact_id) or not re.fullmatch('[0-9a-f]{64}',checksum): raise SystemExit('Invalid producer output')
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
              out.write(f"{role}_id={artifact_id}\n{role}_sha256={checksum}\n{role}_attempt={os.environ['GITHUB_RUN_ATTEMPT']}\n")
          PYCODE

  notes:
    name: Notes
    if: github.repository == 'chen08209/FlClash' && github.event_name == 'push' && github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v') && needs.release_gate.result == 'success' && needs.release_gate.outputs.eligible == 'true' && needs.release_gate.outputs.run_id == github.run_id && needs.release_gate.outputs.attempt == github.run_attempt && needs.release_gate.outputs.commit == github.sha
    needs: release_gate
    runs-on: ubuntu-latest
    outputs:
      notes_id: ${{ steps.artifact.outputs.artifact-id }}
      notes_sha256: ${{ steps.artifact.outputs.artifact-digest }}
      notes_attempt: ${{ github.run_attempt }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: false
      - name: Prepare notes graph
        run: |
          yq -i '.hooks.user_defines.setup.build_assets = false | .hooks.user_defines.rust_api.build_assets = false' pubspec.yaml
          flutter pub get --enforce-lockfile
      - name: Generate release notes
        shell: bash
        env:
          STABLE: ${{ needs.release_gate.outputs.stable }}
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p "$RUNNER_TEMP/notes"
          target=()
          if [[ "$STABLE" == 'true' ]]; then target=(--tag "$TAG"); else dart run tool/changelog.dart build --unreleased; fi
          dart run tool/changelog.dart render release "${target[@]}" --out "$RUNNER_TEMP/notes/release.md"
          dart run tool/changelog.dart render telegram "${target[@]}" --out "$RUNNER_TEMP/notes/telegram.md"
          python tool/ci_release.py pack --role notes --source "$RUNNER_TEMP/notes" --destination "$RUNNER_TEMP/producer-artifact"
      - name: Upload producer artifact
        id: artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: build-${{ github.run_id }}-${{ github.run_attempt }}-notes
          path: ${{ runner.temp }}/producer-artifact/
          overwrite: false
          if-no-files-found: error

  sign_gate:
    name: Sign gate
    if: github.repository == 'chen08209/FlClash' && github.event_name == 'push' && github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v') && needs.release_gate.result == 'success' && needs.release_gate.outputs.eligible == 'true' && needs.release_gate.outputs.run_id == github.run_id && needs.release_gate.outputs.attempt == github.run_attempt && needs.release_gate.outputs.commit == github.sha
    needs: [ release_gate, build ]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    outputs:
      eligible: ${{ steps.gate.outputs.eligible }}
      commit: ${{ steps.gate.outputs.commit }}
      attempt: ${{ steps.gate.outputs.attempt }}
      run_id: ${{ steps.gate.outputs.run_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Verify Android producer before signing role
        id: gate
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python tool/ci_release.py sign-gate --destination "$RUNNER_TEMP/sign-gate"

  sign_android:
    name: Sign Android
    if: github.repository == 'chen08209/FlClash' && github.event_name == 'push' && github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v') && needs.release_gate.result == 'success' && needs.release_gate.outputs.eligible == 'true' && needs.sign_gate.result == 'success' && needs.sign_gate.outputs.eligible == 'true' && needs.release_gate.outputs.run_id == github.run_id && needs.release_gate.outputs.attempt == github.run_attempt && needs.release_gate.outputs.commit == github.sha && needs.sign_gate.outputs.run_id == github.run_id && needs.sign_gate.outputs.attempt == github.run_attempt && needs.sign_gate.outputs.commit == github.sha
    needs: [ release_gate, build, sign_gate ]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    outputs:
      android_final_id: ${{ steps.artifact.outputs.artifact-id }}
      android_final_sha256: ${{ steps.artifact.outputs.artifact-digest }}
      android_final_attempt: ${{ github.run_attempt }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Setup Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare accepted portable SDK signer
        run: |
          python tool/ci_release.py prepare-signer --destination "$RUNNER_TEMP/signer"
          mkdir "$RUNNER_TEMP/signer/classes"
          "$JAVA_HOME/bin/javac" --release 17 -cp "$RUNNER_TEMP/signer/apksigner.jar" -d "$RUNNER_TEMP/signer/classes" tool/ci_android_manifest.java
      - name: Consume exact Android candidate without signing secrets
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python tool/ci_release.py consume --role android-candidate --destination "$RUNNER_TEMP/android-candidate"
      - name: Verify actual APK identity without signing secrets
        id: candidate
        run: python tool/ci_release.py verify-android-candidate --source "$RUNNER_TEMP/android-candidate/android-candidate" --jar "$RUNNER_TEMP/signer/apksigner.jar" --classes "$RUNNER_TEMP/signer/classes"
      - name: Sign and verify selected certificate
        env:
          CI_EXPECTED_ANDROID: ${{ steps.candidate.outputs.android_candidates }}
          KEYSTORE: ${{ secrets.KEYSTORE }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: python tool/ci_release.py sign --source "$RUNNER_TEMP/android-candidate/android-candidate" --destination "$RUNNER_TEMP/android-final" --jar "$RUNNER_TEMP/signer/apksigner.jar" --classes "$RUNNER_TEMP/signer/classes"
      - name: Prepare exact final artifact
        run: python tool/ci_release.py pack --role android-final --source "$RUNNER_TEMP/android-final" --destination "$RUNNER_TEMP/producer-artifact"
      - name: Upload producer artifact
        id: artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: build-${{ github.run_id }}-${{ github.run_attempt }}-android-final
          path: ${{ runner.temp }}/producer-artifact/
          overwrite: false
          if-no-files-found: error

  publish_gate:
    name: Publish gate
    if: github.repository == 'chen08209/FlClash' && github.event_name == 'push' && github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v') && needs.release_gate.result == 'success' && needs.release_gate.outputs.eligible == 'true' && needs.release_gate.outputs.run_id == github.run_id && needs.release_gate.outputs.attempt == github.run_attempt && needs.release_gate.outputs.commit == github.sha
    needs: [ release_gate, build, sign_android, notes ]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    outputs:
      eligible: ${{ steps.gate.outputs.eligible }}
      commit: ${{ steps.gate.outputs.commit }}
      attempt: ${{ steps.gate.outputs.attempt }}
      run_id: ${{ steps.gate.outputs.run_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Verify producers before any publication credential
        id: gate
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python tool/ci_release.py publish-gate --destination "$RUNNER_TEMP/publish-gate"

  publish_telegram:
    name: Publish Telegram
    if: github.repository == 'chen08209/FlClash' && github.event_name == 'push' && github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v') && needs.release_gate.result == 'success' && needs.release_gate.outputs.eligible == 'true' && needs.publish_gate.result == 'success' && needs.publish_gate.outputs.eligible == 'true' && needs.release_gate.outputs.run_id == github.run_id && needs.release_gate.outputs.attempt == github.run_attempt && needs.release_gate.outputs.commit == github.sha && needs.publish_gate.outputs.run_id == github.run_id && needs.publish_gate.outputs.attempt == github.run_attempt && needs.publish_gate.outputs.commit == github.sha
    needs: [ release_gate, build, sign_android, notes, publish_gate ]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    services:
      telegram-bot-api:
        image: aiogram/telegram-bot-api@sha256:ffb6caba7fa957d59ea04f8556ac302dd7821a6a3cebcc0c70a274520565f9aa
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        ports:
          - 8081:8081
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Consume and verify exact release set
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python tool/ci_release.py publish-gate --destination "$RUNNER_TEMP/release-artifacts"
      - name: Send explicit Telegram subset
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TAG: ${{ github.ref_name }}
          RUN_ID: ${{ github.run_id }}
          CI_ARTIFACT_ROOT: ${{ runner.temp }}/release-artifacts
        run: python release_telegram.py

  publish_github:
    name: Publish GitHub
    if: github.repository == 'chen08209/FlClash' && github.event_name == 'push' && github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v') && needs.release_gate.result == 'success' && needs.release_gate.outputs.eligible == 'true' && needs.publish_gate.result == 'success' && needs.publish_gate.outputs.eligible == 'true' && needs.release_gate.outputs.stable == 'true' && needs.release_gate.outputs.run_id == github.run_id && needs.release_gate.outputs.attempt == github.run_attempt && needs.release_gate.outputs.commit == github.sha && needs.publish_gate.outputs.run_id == github.run_id && needs.publish_gate.outputs.attempt == github.run_attempt && needs.publish_gate.outputs.commit == github.sha
    needs: [ release_gate, build, sign_android, notes, publish_gate ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Consume and verify exact release set
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python tool/ci_release.py publish-gate --destination "$RUNNER_TEMP/release-artifacts"
      - name: Stage explicit final files and checksums
        id: stage
        env:
          RELEASE_VERSION: ${{ needs.release_gate.outputs.version }}
        run: |
          python - <<'PYCODE'
          import hashlib,os,pathlib,shutil
          from tool.ci_release import SLOTS,expected_names,regular_file
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'release-artifacts'; target=root.parent/'release-files'; target.mkdir()
          files=[]
          for role in ('android-final',*SLOTS[1:]):
              for name in sorted(expected_names(role,os.environ['RELEASE_VERSION'])):
                  source=regular_file(root/role/name); destination=target/name; shutil.copyfile(source,destination); files.append(destination)
          sums=target/'SHA256SUMS'
          with sums.open('w') as out:
              for path in files:
                  with path.open('rb') as stream: checksum=hashlib.file_digest(stream,'sha256').hexdigest()
                  out.write(checksum+'  '+path.name+'\n')
          files.append(sums)
          body=regular_file(root/'notes/release.md').read_text()+'\n'+pathlib.Path('.github/release_template.md').read_text().replace('VERSION',os.environ['RELEASE_VERSION'])
          (target/'release.md').write_text(body)
          with open(os.environ['GITHUB_OUTPUT'],'a') as out: out.write('files<<CI_FILES\n'+'\n'.join(map(str,files))+'\nCI_FILES\n')
          PYCODE
      - name: Release final files
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ github.ref_name }}
          files: ${{ steps.stage.outputs.files }}
          body_path: ${{ runner.temp }}/release-files/release.md
          fail_on_unmatched_files: true

  publish_tap:
    name: Publish tap
    if: github.repository == 'chen08209/FlClash' && github.event_name == 'push' && github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v') && needs.release_gate.result == 'success' && needs.release_gate.outputs.eligible == 'true' && needs.publish_gate.result == 'success' && needs.publish_gate.outputs.eligible == 'true' && needs.release_gate.outputs.stable == 'true' && needs.release_gate.outputs.run_id == github.run_id && needs.release_gate.outputs.attempt == github.run_attempt && needs.release_gate.outputs.commit == github.sha && needs.publish_gate.outputs.run_id == github.run_id && needs.publish_gate.outputs.attempt == github.run_attempt && needs.publish_gate.outputs.commit == github.sha
    needs: [ release_gate, build, sign_android, notes, publish_gate ]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Consume and verify exact release set
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python tool/ci_release.py publish-gate --destination "$RUNNER_TEMP/release-artifacts"
      - name: Generate Cask from exact macOS files
        env:
          RELEASE_VERSION: ${{ needs.release_gate.outputs.version }}
        run: |
          python - <<'PYCODE'
          import hashlib,os,pathlib
          from tool.ci_release import regular_file
          version=os.environ['RELEASE_VERSION']; root=pathlib.Path(os.environ['RUNNER_TEMP'])/'release-artifacts'
          template=pathlib.Path('.github/homebrew_cask_template.rb').read_text().replace('VERSION',version)
          for arch,label in [('arm64','ARM_SHA256'),('amd64','AMD_SHA256')]:
              with regular_file(root/('macos-'+arch)/f'FlClash-{version}-macos-{arch}.dmg').open('rb') as stream: checksum=hashlib.file_digest(stream,'sha256').hexdigest()
              template=template.replace(label,checksum)
          target=root.parent/'tap/Casks'; target.mkdir(parents=True); (target/'flclash.rb').write_text(template)
          PYCODE
      - name: Push Homebrew tap
        env:
          SSH_DEPLOY_KEY: ${{ secrets.HOMEBREW_SSH_DEPLOY_KEY }}
        run: python tool/ci_push.py --target tap --source "$RUNNER_TEMP/tap"

  publish_fdroid:
    name: Publish F-Droid
    if: github.repository == 'chen08209/FlClash' && github.event_name == 'push' && github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v') && needs.release_gate.result == 'success' && needs.release_gate.outputs.eligible == 'true' && needs.publish_gate.result == 'success' && needs.publish_gate.outputs.eligible == 'true' && needs.release_gate.outputs.stable == 'true' && needs.release_gate.outputs.run_id == github.run_id && needs.release_gate.outputs.attempt == github.run_attempt && needs.release_gate.outputs.commit == github.sha && needs.publish_gate.outputs.run_id == github.run_id && needs.publish_gate.outputs.attempt == github.run_attempt && needs.publish_gate.outputs.commit == github.sha
    needs: [ release_gate, build, sign_android, notes, publish_gate ]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Consume and verify exact release set
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python tool/ci_release.py publish-gate --destination "$RUNNER_TEMP/release-artifacts"
      - name: Stage exact signed ARM64 APK
        env:
          RELEASE_VERSION: ${{ needs.release_gate.outputs.version }}
        run: |
          python - <<'PYCODE'
          import os,pathlib,shutil
          from tool.ci_release import regular_file
          root=pathlib.Path(os.environ['RUNNER_TEMP']); name='FlClash-'+os.environ['RELEASE_VERSION']+'-android-arm64-v8a.apk'
          target=root/'fdroid'; target.mkdir(); shutil.copyfile(regular_file(root/'release-artifacts/android-final'/name),target/name)
          PYCODE
      - name: Push F-Droid repository
        env:
          SSH_DEPLOY_KEY: ${{ secrets.SSH_DEPLOY_KEY }}
        run: python tool/ci_push.py --target fdroid --source "$RUNNER_TEMP/fdroid"
